# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      apiKey:
        type: string
        description: Your VideoUpscaler API key (vu_live_...) from https://videoupscaler.co/settings/apikeys
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['bin/videoupscaler-mcp.mjs'],
      env: { VIDEOUPSCALER_API_KEY: config.apiKey }
    })
  exampleConfig:
    apiKey: vu_live_example_key_123456
