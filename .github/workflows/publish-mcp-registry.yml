name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.json'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
      - name: Authenticate via GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Validate and publish to MCP Registry
        run: |
          mcp-publisher validate
          mcp-publisher publish
